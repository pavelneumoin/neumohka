# /etc/nginx/sites-enabled/neumoshka
# Применяется когда DNS neumoshka.ru → 130.193.35.199 пропагирует.
# certbot --nginx -d neumoshka.ru -d www.neumoshka.ru добавит SSL-блок автоматически.

# HTTP → HTTPS редирект (заполняется certbot-ом, тут шаблон)
server {
    listen 80;
    listen [::]:80;
    server_name neumoshka.ru www.neumoshka.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name neumoshka.ru www.neumoshka.ru;

    # SSL пути заполнит certbot
    # ssl_certificate /etc/letsencrypt/live/neumoshka.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/neumoshka.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Статика Next.js (быстрая отдача мимо Node)
    location /_next/static/ {
        alias /opt/neumoshka-web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Файлы из public/ (preview.png, robots.txt, favicon — НЕ PDF)
    location ~ ^/library/.+\.png$ {
        alias /opt/neumoshka-web/public$uri;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Всё остальное — на standalone Next.js
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
