# Временный HTTP-конфиг для первого запуска.
# После успешного nginx -t Certbot добавит HTTPS-блок и редирект.
server {
    listen 80;
    listen [::]:80;
    server_name neumoshka.ru www.neumoshka.ru;

    client_max_body_size 20M;

    # Статика Next.js (быстрая отдача мимо Node)
    location /_next/static/ {
        alias /opt/neumoshka-web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Из library nginx отдаёт только PNG. PDF всегда проходят через /api/file.
    location ~ ^/library/.+\.png$ {
        alias /opt/neumoshka-web/public$uri;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Всё остальное — на standalone Next.js.
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
